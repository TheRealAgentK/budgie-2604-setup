# charge-guard settings - shell syntax, sourced by the daemon.
# After editing:  systemctl --user restart charge-guard

LIMIT=80            # warn at or above this percentage while a charger is connected
RESUME=75           # episode is over below this
POLL=30             # seconds between checks
REPEAT_MIN=10       # re-warn every N minutes while still over the limit (0 = once)
NOTIFY=1            # 0 disables desktop notifications

# Optional: with a switchable plug these turn the warning into a real cutoff.
# Anything runnable by sh. Examples:
#   AT_LIMIT_CMD="tasmota-cli --device desk-plug --off"
#   AT_LIMIT_CMD="curl -fsS http://192.168.1.50/relay/0?turn=off"
#   AT_LIMIT_CMD="kasa --host 192.168.1.50 off"
AT_LIMIT_CMD=""
BELOW_RESUME_CMD=""
